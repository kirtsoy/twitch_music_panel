<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>420 Mixtape (Vol. 1) - KIRTSOY Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>
    <div class="haze-container"></div>
    <div class="ambient-glow"></div>

    <div class="panel-wrapper">
        <div class="panel-card">
            <!-- Header -->
            <header class="panel-header">
                <h1 class="album-logo">420 MIXTAPE <span class="vol-tag">VOL.1</span></h1>
                <p class="album-sub">KIRTSOY</p>

                <!-- Navigation Tabs -->
                <nav class="tab-nav">
                    <button id="tab-player-btn" class="tab-btn active">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                        ПЛЕЕР
                    </button>
                    <button id="tab-tracks-btn" class="tab-btn">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                        ТРЕКИ (24)
                    </button>
                </nav>
            </header>

            <!-- Main Content Area -->
            <main class="panel-content">
                <!-- VIEW 1: Player View -->
                <section id="view-player" class="view-section active">
                    <!-- Vinyl Staging -->
                    <div class="vinyl-stage">
                        <div class="vinyl-disk" id="vinyl-disk">
                            <div class="vinyl-grooves"></div>
                            <div class="vinyl-center"></div>
                        </div>
                        <div class="cover-frame">
                            <img id="cover-img" src="assets/cover.webp" alt="420 Mixtape Cover">
                            <div class="cover-glow"></div>
                        </div>
                    </div>

                    <!-- Track Details -->
                    <div class="track-meta">
                        <span id="track-index" class="track-number">TRACK 01 / 24</span>
                        <h2 id="track-title" class="track-title">clip</h2>
                        <p class="track-artist">KIRTSOY</p>
                    </div>

                    <!-- Live Audio Visualizer Canvas -->
                    <div class="visualizer-container">
                        <canvas id="visualizer-canvas" width="280" height="32"></canvas>
                    </div>

                    <!-- Timeline & Progress -->
                    <div class="timeline-box">
                        <div class="time-row">
                            <span id="time-current" class="time-label">0:00</span>
                            <span id="time-total" class="time-label">1:24</span>
                        </div>
                        <div class="progress-bar-wrapper" id="progress-wrapper">
                            <div class="progress-bar-bg">
                                <div id="progress-bar-fill" class="progress-bar-fill"></div>
                                <div id="progress-thumb" class="progress-thumb"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Playback Controls -->
                    <div class="controls-row">
                        <button id="btn-shuffle" class="icon-btn" title="Перемешать (Shuffle)">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                            </svg>
                        </button>

                        <button id="btn-prev" class="icon-btn" title="Предыдущий трек">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                            </svg>
                        </button>

                        <button id="btn-play-pause" class="main-play-btn" title="Воспроизведение / Пауза (Space)">
                            <svg id="icon-play" class="play-svg" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg id="icon-pause" class="pause-svg hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                        </button>

                        <button id="btn-next" class="icon-btn" title="Следующий трек">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                            </svg>
                        </button>

                        <button id="btn-repeat" class="icon-btn" title="Повтор (Repeat)">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                            </svg>
                        </button>
                    </div>

                    <!-- Volume Bar -->
                    <div class="volume-row">
                        <button id="btn-mute" class="vol-btn" title="Вкл/Выкл звук">
                            <svg id="icon-vol-on" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                            <svg id="icon-vol-off" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                            </svg>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.85" class="vol-slider">
                    </div>
                </section>

                <!-- VIEW 2: Tracklist View -->
                <section id="view-tracks" class="view-section">
                    <div class="tracks-list-header">
                        <span>ТРЕКЛИСТ МИКСТЕЙПА</span>
                        <span class="track-count-badge">24 ТРЕКА</span>
                    </div>
                    <div class="tracks-scroll-container" id="tracks-container">
                        <!-- Populated by JavaScript -->
                    </div>
                </section>
            </main>

            <!-- Footer / Streaming Links -->
            <footer class="panel-footer">
                <div class="platform-links">
                    <a href="https://open.spotify.com/artist/3yFMC9nDGATXOAz8HsvKVG" target="_blank" rel="noopener" class="platform-link link-spotify" title="KIRTSOY на Spotify">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                        </svg>
                        SPOTIFY
                    </a>
                    <a href="https://music.apple.com/us/artist/kirtsoy/1794251361" target="_blank" rel="noopener" class="platform-link link-apple" title="KIRTSOY на Apple Music">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8.92-2.87-.93.04-2.02.63-2.65 1.38-.56.65-.99 1.72-.86 2.76 1.02.08 2.02-.57 2.59-1.27z"/>
                        </svg>
                        APPLE
                    </a>
                    <a href="https://music.youtube.com/channel/UCm241CE93k5deapyTbN5EqA" target="_blank" rel="noopener" class="platform-link link-yt" title="KIRTSOY на YouTube Music">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm-2-6.5v4l3.5-2-3.5-2z"/>
                        </svg>
                        YT MUSIC
                    </a>
                </div>
            </footer>
        </div>
    </div>

    <!-- Hidden native audio tag -->
    <audio id="audio-engine" preload="auto" crossorigin="anonymous"></audio>

    <script src="app.js"></script>
</body>
</html>
